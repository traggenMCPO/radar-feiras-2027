  const empresas = new Set(DADOS.flatMap(d => d.empresas || [])).size;
  $("#kpis").innerHTML = `<div class="kpi"><b>${DADOS.length}</b>sinais monitorados</div><div class="kpi"><b>${novos24}</b>novos em 24h</div>
    <div class="kpi"><b>${empresas}</b>empresas citadas</div><div class="kpi"><b>${DADOS.filter(d=>d.intencao==="Confirmada").length}</b>confirmações</div>
    <div class="kpi"><b>${DADOS.filter(d=>d.intencao==="Não participará").length}</b>desistências</div>`;
  $("#lista").innerHTML = lista.length ? lista.map(d => {
    const novo = agora - new Date(d.encontrado_em) < 864e5;
    return `<article class="card">
      <div class="thumb" style="background-image:url('${cssUrl(d.imagem || placeholder(d.segmento))}'),url('${placeholder(d.segmento)}')">
        <span class="rede">${esc(d.rede)}</span>${novo ? '<span class="novo">NOVO</span>' : ""}</div>
      <div class="corpo">
        <span class="int ${CLS_INT[d.intencao]||"i5"}">${esc(d.intencao)} · ${d.confianca||0}%</span>
        <h3><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.titulo_ia || d.titulo)}</a></h3>
        <div class="meta">${ICONES[d.segmento]||""} ${esc(d.segmento)} · ${esc(d.fonte)} · ${fmt(d.publicado || d.encontrado_em)}</div>
        <p class="resumo">${esc(d.resumo)}</p>
        <div class="tags">${(d.feiras||[]).map(f=>`<span class="tag">🎪 ${esc(f)}</span>`).join("")}${(d.empresas||[]).map(e=>`<span class="tag emp">🏢 ${esc(e)}</span>`).join("")}</div>
        <div class="rodape"><span>Encontrado ${fmt(d.encontrado_em)}</span><a href="${esc(d.url)}" target="_blank" rel="noopener">Abrir ↗</a></div>
      </div></article>`;
  }).join("") : '<div class="vazio">Nenhum sinal encontrado com esses filtros ainda. O radar roda a cada 30 minutos.</div>';
}
["#busca","#fFeira","#fInt","#fRede"].forEach(s => $(s).addEventListener("input", render));
render();
</script>
</body>
</html>

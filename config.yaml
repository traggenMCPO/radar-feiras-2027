# Termos combinados com cada feira nas buscas de notícias
termos_participacao: "(2027 OR expositor OR expositores OR estande OR stand OR participação OR \"próxima edição\")"

# Buscas genéricas extras (não ligadas a uma feira específica)
consultas_extras:
  - "feiras agrícolas 2027 expositores"
  - "calendário feiras agro 2027"
  - "\"vai participar\" feira agro 2027"
  - "\"não participará\" feira agrícola"
  - "empresa desiste de participar feira agro"
  - "estande feira agronegócio 2027 lançamento"
  - "máquinas agrícolas feiras 2027"
  - "venda de espaços feira agro 2027"

# Segmentos usados para separar a página em abas (a IA classifica em um deles)
segmentos:
  - "Máquinas Agrícolas"
  - "Implementos"
  - "Sementes e Genética"
  - "Fertilizantes e Nutrição"
  - "Defensivos e Biológicos"
  - "Agricultura de Precisão e Tecnologia"
  - "Irrigação e Armazenagem"
  - "Pecuária e Saúde Animal"
  - "Crédito, Seguros e Serviços"
  - "Organização da Feira / Geral"
  - "Outros"


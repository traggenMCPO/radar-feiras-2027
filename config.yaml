  - { nome: "Showtec",                 local: "Maracaju/MS",              mes: "jan", aliases: ["showtec"] }
  - { nome: "Femec",                   local: "Uberlândia/MG",            mes: "mar", aliases: ["femec"] }
  - { nome: "Agroleite",               local: "Castro/PR",                mes: "ago", aliases: ["agroleite"] }
  - { nome: "Digital Agro",            local: "Carambeí/PR",              mes: "jun", aliases: ["digital agro"] }

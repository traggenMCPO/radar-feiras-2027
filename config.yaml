# =====================================================================
#  RADAR DE EXPOSITORES - FEIRAS AGRO 2027
#  Edite este arquivo para incluir/remover feiras, fontes e redes.
# =====================================================================

ano_alvo: 2027

# Endereço público da página (GitHub Pages). Troque SEU-USUARIO e o nome do repositório.
url_pagina: "https://traggenmcpo.github.io/radar-feiras-2027/"

# Só considera conteúdo publicado nos últimos N dias (evita reprocessar coisa velha)
janela_dias: 45

claude:
  modelo: "claude-haiku-4-5"     # barato e rápido. Para análise mais fina: "claude-sonnet-4-5"
  itens_por_lote: 8
  max_itens_por_execucao: 80     # limite de custo por rodada (o excedente fica para a próxima)

notificacao:
  enviar_email_sem_novidades: false   # true = manda e-mail a cada 30 min mesmo sem nada novo
  confianca_minima_email: 40          # só notifica itens com confiança >= este valor (0-100)

# ---------------------------------------------------------------------
# FEIRAS MONITORADAS  (aliases = como o nome aparece nos textos, sem acento)
# ---------------------------------------------------------------------

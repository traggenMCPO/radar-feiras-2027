youtube:
  ativo: true                 # requer o secret YOUTUBE_API_KEY (gratuito)
  buscas_por_execucao: 2      # cota gratuita: ~100 buscas/dia -> 2 por rodada de 30 min

# ---------------------------------------------------------------------
# REDES SOCIAIS FECHADAS VIA APIFY (pago; requer o secret APIFY_TOKEN)
#  - a_cada_horas controla o custo (rodar a cada 30 min nessas redes sai caro)
#  - "entrada" é enviada exatamente como está para o ator do Apify;
#    confira o formato na página de cada ator em apify.com/store
# ---------------------------------------------------------------------
apify:
  ativo: true
  atores:
    - nome: "Instagram"
      ator: "apify/instagram-hashtag-scraper"
      a_cada_horas: 2
      entrada:
        hashtags: ["expointer2027", "expointer", "agrishow2027", "agrishow", "expodireto2027", "expodireto",
                   "showrural2027", "showrural", "bahiafarmshow", "agrobrasilia", "agrotins", "tecnoshowcomigo",
                   "agrobalsas", "fenasucro", "hortitec", "nortshow", "showsafra"]
        resultsLimit: 15
    - nome: "TikTok"
      ator: "clockworks/tiktok-scraper"
      a_cada_horas: 4
      entrada:
        hashtags: ["expointer", "agrishow", "expodireto", "showrural", "bahiafarmshow", "agrobrasilia", "agrotins"]
        resultsPerPage: 10
    - nome: "X (Twitter)"
      ator: "apidojo/tweet-scraper"
      a_cada_horas: 2
      entrada:
        searchTerms: ["expointer 2027", "agrishow 2027", "expodireto 2027", "show rural 2027", "bahia farm show 2027",
                      "agrobrasilia 2027", "agrotins 2027", "tecnoshow 2027", "expositores feira agro"]
        maxItems: 60
        sort: "Latest"
    - nome: "LinkedIn"
      ator: "harvestapi/linkedin-post-search"
      a_cada_horas: 4
      entrada:
        searchQueries: ["Expointer 2027", "Agrishow 2027", "Expodireto 2027", "Show Rural 2027", "Bahia Farm Show 2027",
                        "AgroBrasília 2027", "Tecnoshow 2027", "feira agro estande 2027"]
        maxPosts: 15
    - nome: "Facebook"
      ator: "apify/facebook-posts-scraper"
      a_cada_horas: 6
      entrada:
        # Páginas oficiais das feiras no Facebook - CONFIRA/AJUSTE os endereços
        startUrls:
          - { url: "https://www.facebook.com/expointeroficial" }
          - { url: "https://www.facebook.com/agrishow" }
          - { url: "https://www.facebook.com/expodiretocotrijal" }
          - { url: "https://www.facebook.com/showruralcoopavel" }
          - { url: "https://www.facebook.com/bahiafarmshow" }
        resultsLimit: 10

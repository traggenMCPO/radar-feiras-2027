  - { nome: "Tecnoshow Comigo",        local: "Rio Verde/GO",             mes: "abr", aliases: ["tecnoshow"] }
  - { nome: "Agrishow",                local: "Ribeirão Preto/SP",        mes: "abr/mai", aliases: ["agrishow"] }
  - { nome: "AgroBrasília",            local: "Brasília/DF",              mes: "mai", aliases: ["agrobrasilia", "agro brasilia"] }
  - { nome: "Agrotins",                local: "Palmas/TO",                mes: "mai", aliases: ["agrotins"] }
  - { nome: "Rondônia Rural Show",     local: "Ji-Paraná/RO",             mes: "mai", aliases: ["rondonia rural show"] }
  - { nome: "Expoagro Afubra",         local: "Rio Pardo/RS",             mes: "mar", aliases: ["expoagro afubra", "afubra"] }
  - { nome: "AgroBalsas",              local: "Balsas/MA",                mes: "mai", aliases: ["agrobalsas", "agro balsas"] }
